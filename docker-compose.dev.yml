name: house-chatbot

services:
  house-chatbot:
    # The image copies a prebuilt dist/housebot (amd64 musl binary), so
    # start the stack with scripts/dev-up.sh instead of a bare
    # `docker compose up --build`.
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    depends_on:
      - sandboxd
    volumes:
      - ./data:/app/data
      - sandbox-socket:/run/housebot-sandbox
    environment:
      - DATA_DIR=/app/data
      - SANDBOX_SOCKET_PATH=/run/housebot-sandbox/sandbox.sock
      - HOST_DATA_DIR=${HOST_DATA_DIR}

  sandboxd:
    build:
      context: .
      dockerfile: Dockerfile.sandboxd
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox-socket:/run/housebot-sandbox
    environment:
      - SANDBOX_SOCKET_PATH=/run/housebot-sandbox/sandbox.sock
      - HOUSEBOT_SANDBOX_IMAGE=house-chatbot-sandbox:latest
      # Dev hosts rarely have gVisor installed; production defaults to runsc.
      - HOUSEBOT_SANDBOX_RUNTIME=${HOUSEBOT_SANDBOX_RUNTIME:-runc}
      - SANDBOX_IDLE_TIMEOUT_SECS=${SANDBOX_IDLE_TIMEOUT_SECS:-300}

volumes:
  sandbox-socket:
