apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
# gVisor intercepts syscalls in userspace, so a container escape has to get
# through runsc before it reaches the host kernel. Nodes must have the runsc
# handler installed and be labelled `housebot.dev/gvisor: "true"`.
handler: runsc
scheduling:
  nodeSelector:
    housebot.dev/gvisor: "true"
