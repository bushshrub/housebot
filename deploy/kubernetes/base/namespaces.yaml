apiVersion: v1
kind: Namespace
metadata:
  name: housebot
  labels:
    # Pod Security Admission enforces the restricted profile: no privileged
    # pods, no host namespaces, no root, and no unconfined seccomp.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  # Sandboxes live apart from the control plane they are driven by, so a
  # NetworkPolicy or quota written for them can never loosen the bot's.
  name: housebot-sandboxes
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
