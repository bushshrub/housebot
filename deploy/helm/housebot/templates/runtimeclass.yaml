{{- if and .Values.sandbox.runtimeClass.create .Values.sandbox.runtimeClassName }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.sandbox.runtimeClassName }}
  labels:
    {{- include "housebot.labels" . | nindent 4 }}
# gVisor intercepts syscalls in userspace, so a container escape has to get
# through runsc before it reaches the host kernel. Nodes must have the handler
# installed and carry the nodeSelector labels below.
handler: {{ .Values.sandbox.runtimeClass.handler }}
{{- with .Values.sandbox.runtimeClass.nodeSelector }}
scheduling:
  nodeSelector:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
