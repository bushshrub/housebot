{{- if .Values.sandboxApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "housebot.sandboxApi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "housebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-api
spec:
  {{- if not .Values.sandboxApi.autoscaling.enabled }}
  replicas: {{ .Values.sandboxApi.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "housebot.sandboxApi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "housebot.sandboxApi.selectorLabels" . | nindent 8 }}
        {{- with .Values.sandboxApi.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the Deployment when the shared token changes, so replicas never
        # serve with a token the bot has already stopped sending.
        checksum/auth: {{ include "housebot.sandboxApi.token" . | sha256sum }}
        {{- with .Values.sandboxApi.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "housebot.sandboxApi.fullname" . }}
      # Unlike a sandbox Pod, the API does need its token: driving sandbox Pods
      # is the whole job.
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox-api
          image: {{ include "housebot.image" (dict "image" .Values.sandboxApi.image "root" $) }}
          imagePullPolicy: {{ .Values.sandboxApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # In-cluster the API drives sandboxes as gVisor Pods through the
            # API server. Off-cluster the same binary defaults to the Docker
            # backend, which is what `docker compose` runs.
            - name: SANDBOX_RUNTIME_BACKEND
              value: kubernetes
            - name: HOUSEBOT_SANDBOX_NAMESPACE
              value: {{ .Values.sandbox.namespace }}
            - name: HOUSEBOT_SANDBOX_IMAGE
              value: {{ .Values.sandbox.image }}
            {{- with .Values.sandbox.runtimeClassName }}
            - name: HOUSEBOT_SANDBOX_RUNTIME_CLASS
              value: {{ . | quote }}
            {{- end }}
            - name: SANDBOX_IDLE_TIMEOUT_SECS
              value: {{ .Values.sandbox.idleTimeoutSeconds | quote }}
            - name: SANDBOX_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "housebot.sandboxApi.secretName" . }}
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.sandboxApi.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      {{- with .Values.sandboxApi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sandboxApi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sandboxApi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "housebot.sandboxApi.selectorLabels" . | nindent 14 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "housebot.sandboxApi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "housebot.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-api
spec:
  type: {{ .Values.sandboxApi.service.type }}
  selector:
    {{- include "housebot.sandboxApi.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.sandboxApi.service.port }}
      targetPort: http
{{- if .Values.sandboxApi.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "housebot.sandboxApi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "housebot.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "housebot.sandboxApi.fullname" . }}
  minReplicas: {{ .Values.sandboxApi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.sandboxApi.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.sandboxApi.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.sandboxApi.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "housebot.sandboxApi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "housebot.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.sandboxApi.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "housebot.sandboxApi.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
