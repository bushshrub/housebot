apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "housebot.sandboxApi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "housebot.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  # The identity sandbox Pods run under. It is granted nothing, and Pods never
  # mount its token — it exists only so sandboxes do not inherit `default`.
  name: {{ include "housebot.sandbox.serviceAccountName" . }}
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "housebot.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "housebot.sandboxApi.fullname" . }}
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "housebot.labels" . | nindent 4 }}
rules:
  # Exactly what driving a sandbox needs, in one namespace: nothing here can
  # read a Secret, reach another namespace, or create a workload controller
  # that would outlive the API.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "housebot.sandboxApi.fullname" . }}
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "housebot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "housebot.sandboxApi.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "housebot.sandboxApi.fullname" . }}
    namespace: {{ .Release.Namespace }}
