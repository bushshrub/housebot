apiVersion: v1
kind: Pod
metadata:
  name: {{ include "housebot.fullname" . }}-test-sandbox-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "housebot.bot.selectorLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: {{ include "housebot.image" (dict "image" .Values.sandboxApi.image "root" $) }}
      # The bot's own labels are on this Pod, so a pass proves the Service
      # resolves and the NetworkPolicy admits traffic from the bot.
      command:
        - wget
        - -q
        - -O-
        - http://{{ include "housebot.sandboxApi.fullname" . }}:{{ .Values.sandboxApi.service.port }}/healthz
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
