---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: releases.housebot.dev
spec:
  group: housebot.dev
  names:
    kind: Release
    listKind: ReleaseList
    plural: releases
    shortNames:
    - rel
    singular: release
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.current
      name: Current
      type: string
    - jsonPath: .status.pinned
      name: Pinned
      type: boolean
    - jsonPath: .spec.track
      name: Track
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Release declares which version of a chart should be running. The version
          lives here rather than in git so that a deploy is a field patch instead of a
          commit.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              helmReleaseRef:
                description: |-
                  The HelmRelease whose readiness is mirrored into status. Optional: without
                  it the Release reports only what it resolved, not whether it landed.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              historyLimit:
                default: 10
                description: Entries kept in status.history.
                format: int32
                minimum: 1
                type: integer
              interval:
                default: 2m
                description: How often the registry is polled while following a track.
                type: string
              ociRepositoryRef:
                description: The Flux OCIRepository to patch.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    description: Defaults to the Release's own namespace.
                    type: string
                required:
                - name
                type: object
              track:
                description: |-
                  Glob matched against the chart's tags in the registry, such as
                  "0.1.0-sha.*". Ignored while version is set.
                type: string
              version:
                description: |-
                  An explicit chart version. Setting it pins the Release: track following
                  stops until it is cleared again. This is what makes a rollback stick —
                  without the pin the poller would see the newer, broken chart still in the
                  registry and redeploy it on the next tick.
                type: string
            required:
            - ociRepositoryRef
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              current:
                description: The chart version currently written to the OCIRepository.
                type: string
              helmRelease:
                description: |-
                  HelmReleaseStatus mirrors the readiness of the HelmRelease Flux drives from
                  the OCIRepository this Release patches.
                properties:
                  message:
                    type: string
                  ready:
                    type: boolean
                  version:
                    type: string
                required:
                - ready
                type: object
              history:
                description: Newest first, bounded by spec.historyLimit.
                items:
                  description: HistoryEntry records one version this Release deployed.
                  properties:
                    at:
                      format: date-time
                      type: string
                    by:
                      enum:
                      - auto
                      - pin
                      type: string
                    version:
                      type: string
                  required:
                  - at
                  - by
                  - version
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              pinned:
                description: True while spec.version holds the Release off its track.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
