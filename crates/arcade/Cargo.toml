[package]
name = "housebot-arcade"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Arcade simulator — WebGL arena game served by a dependency-free HTTP backend"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "arcade"
path = "src/bin/arcade.rs"
