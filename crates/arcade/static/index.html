<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Housebot Arcade</title>
<style>
  :root {
    --neon: #38f2d0;
    --hot: #ff2e88;
    --gold: #ffe066;
    --ink: #05030c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--ink); overflow: hidden; }
  body {
    font: 14px/1.5 "Courier New", ui-monospace, monospace;
    color: var(--neon);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #prompt {
    position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%);
    padding: 10px 22px; border: 1px solid var(--neon);
    background: rgba(5, 3, 12, .72); text-shadow: 0 0 12px currentColor;
    opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  #prompt.show { opacity: 1; }

  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2px 0 0 -2px;
    background: var(--neon); border-radius: 50%; opacity: .5; pointer-events: none;
  }

  #cabinetScreen {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -52%) scale(.9);
    height: 62vh; width: calc(62vh * 256 / 240);
    image-rendering: pixelated; display: none;
    border: 3px solid rgba(255,255,255,.10); border-radius: 6px;
    box-shadow: 0 0 60px rgba(0,0,0,.85), 0 0 120px rgba(56,242,208,.18);
    opacity: 0; transition: opacity .25s, transform .25s;
  }
  #cabinetScreen.show { display: block; opacity: 1; transform: translate(-50%, -52%) scale(1); }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    opacity: 0; transition: opacity .25s;
  }
  #hud.show { opacity: 1; }
  #hud .plate {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    text-align: center; text-shadow: 0 0 14px currentColor;
  }
  #machineTitle { font-size: 22px; color: var(--hot); }
  #machineScore { font-size: 30px; color: #fff; }
  #machineHint {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-size: 11px; opacity: .55; text-transform: none; letter-spacing: .1em;
  }

  .screen {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 50% 45%, rgba(56,242,208,.10), rgba(5,3,12,.95) 60%);
  }
  .screen.show { display: flex; }
  .screen h1 {
    margin: 0; font-size: 60px; letter-spacing: .28em; color: var(--hot);
    text-shadow: 0 0 30px currentColor;
  }
  .screen h2 { margin: 0; font-size: 20px; color: var(--gold); }
  .screen p { margin: 0; max-width: 520px; text-align: center; opacity: .82; }
  .keys { opacity: .5; font-size: 12px; text-transform: none; letter-spacing: .1em; }

  button, input {
    font: inherit; text-transform: uppercase; letter-spacing: .18em;
    color: var(--neon); background: transparent; border: 1px solid var(--neon);
    padding: 12px 26px; outline: none;
  }
  button { cursor: pointer; }
  button:hover { color: var(--ink); background: var(--neon); box-shadow: 0 0 24px var(--neon); }
  input { width: 240px; text-align: center; }
  #saveForm { display: flex; gap: 10px; }
  .final { font-size: 26px; color: #fff; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="crosshair"></div>
<canvas id="cabinetScreen" width="256" height="240"></canvas>
<div id="prompt"></div>

<div id="hud">
  <div class="plate">
    <div id="machineTitle"></div>
    <div id="machineScore"></div>
  </div>
  <div id="machineHint"></div>
</div>

<div class="screen show" id="introScreen">
  <h1>Arcade</h1>
  <p>Four machines, all switched on. Walk up to one and press E to play it.</p>
  <button id="enterBtn">Push The Door Open</button>
  <div class="keys">WASD walk &middot; mouse look &middot; E play &middot; Q step back</div>
</div>

<div class="screen" id="saveScreen">
  <h2 id="saveCabinet"></h2>
  <div class="final"><span id="saveScore">0</span> points</div>
  <form id="saveForm">
    <input id="nameInput" maxlength="12" placeholder="Your name" autocomplete="off">
    <button type="submit">Save</button>
  </form>
  <button id="skipBtn">Back To The Floor</button>
  <div id="saveNote" class="keys"></div>
</div>

<script src="/machines.js"></script>
<script src="/game.js"></script>
</body>
</html>
